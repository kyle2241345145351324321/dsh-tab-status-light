name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Is this version already on npm?
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-tab-status-light@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::dsh-tab-status-light@$VERSION is already published — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::publishing dsh-tab-status-light@$VERSION"
          fi
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
